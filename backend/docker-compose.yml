services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://conduit:conduit@db:5432/conduit?schema=public
      JWT_SECRET: ${JWT_SECRET:-thesis-dss-local-jwt-secret}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
